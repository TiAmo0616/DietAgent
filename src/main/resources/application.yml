spring:
  application:
    name: harness-agent
  datasource:
    url: ${DIET_DB_URL:jdbc:mysql://localhost:3306/diet_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DIET_DB_USERNAME:root}
    password: ${DIET_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.diet.model
  configuration:
    map-underscore-to-camel-case: true
server:
  port: ${SERVER_PORT:8080}
agentscope:
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
diet:
  llm:
    main-model: ${DIET_MAIN_MODEL:qwen-max}
    light-model: ${DIET_LIGHT_MODEL:qwen-turbo}
  session:
    max-history-turns: ${DIET_MAX_HISTORY_TURNS:10}
  context:
    intent-token-budget: ${DIET_INTENT_CONTEXT_TOKEN_BUDGET:1800}
  idempotency:
    ttl-seconds: ${DIET_IDEMPOTENCY_TTL_SECONDS:600}
    max-entries: ${DIET_IDEMPOTENCY_MAX_ENTRIES:10000}
logging:
  level:
    com.diet: INFO
